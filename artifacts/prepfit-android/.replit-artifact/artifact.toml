kind = "mobile"
previewPath = "/prepfit-android/"
title = "PrepFit Android"
version = "1.0.0"
id = "artifacts/prepfit-android"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/prepfit-android/" ]
localPort = 18104

[services.development]
run = "pnpm --filter @workspace/prepfit-android run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prepfit-android", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/prepfit-android", "run", "serve" ]

[services.env]
PORT = "18104"
BASE_PATH = "/prepfit-android/"
