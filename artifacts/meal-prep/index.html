    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://prepfit.fit/" />

    <meta name="theme-color" content="#e8580a" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PrepFit" />
    <meta name="application-name" content="PrepFit" />

    <!-- JSON-LD Structured Data -->
    <script id="home-structured-data" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "@id": "https://prepfit.fit/#app",
          "name": "PrepFit",
          "url": "https://prepfit.fit/",
          "description": "Meal prep app for gym-goers. Generate personalized weekly meal plans, track macros and weight, and get smart grocery lists.",
          "applicationCategory": "HealthApplication",
          "operatingSystem": "iOS, Android, Web",
          "browserRequirements": "Requires JavaScript",
          "offers": {
            "@type": "Offer",
            "price": "14.00",
            "priceCurrency": "USD",
            "billingIncrement": "P1M",
            "priceSpecification": {
              "@type": "UnitPriceSpecification",
              "price": "168.00",
              "priceCurrency": "USD",
              "billingDuration": "P1Y"
            },
            "description": "PrepFit Pro — $14/month billed annually at $168/year",
            "hasMerchantReturnPolicy": {
              "@type": "MerchantReturnPolicy",
              "returnPolicyCategory": "https://schema.org/MerchantReturnFiniteReturnWindow"
            }
          },
          "featureList": [
            "Smart Meal Plan Generation",
            "Smart Grocery Lists",
            "Macro & Calorie Tracking",
            "Weight Tracker",
            "Water Intake Tracker",
            "Saved Meal Plans"
          ],
          "screenshot": "https://prepfit.fit/opengraph.jpg",
          "image": "https://prepfit.fit/opengraph.jpg"
        },
        {
          "@type": "Organization",
          "@id": "https://prepfit.fit/#org",
          "name": "PrepFit",
          "url": "https://prepfit.fit/",
          "logo": "https://prepfit.fit/opengraph.jpg",
          "legalName": "bestappsmade LLC",
          "description": "Makers of PrepFit — meal prep and fitness nutrition tools."
        }
      ]
    }
    </script>

    <!-- The same HTML shell is served at every route. Do not put a homepage
         canonical in the original HTML: set one only for public pages. -->
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, "") || "/";
        var pages = {
          "/": {
            title: "PrepFit — Meal Prep App for Gym & Fitness",
            description: "A meal prep app that builds a week of meals around your calorie and macro targets, generates your grocery list, and tracks your progress."
          },
          "/meal-prep-app-guide": {
            title: "Meal Prep Apps for the Gym: A Practical Guide | PrepFit",
            description: "Learn how meal prep apps help you plan meals around calorie and macro targets, build grocery lists, and prepare food for the week."
          },
          "/android": {
            title: "Install PrepFit on Android | PrepFit",
            description: "Install PrepFit on your Android phone in seconds. Add it to your home screen using Chrome, Samsung Internet, or Edge."
          },
          "/ios": {
            title: "Install PrepFit on iPhone | PrepFit",
            description: "Install PrepFit on your iPhone in seconds. Add it to your home screen using Safari."
          },
          "/privacy": {
            title: "Privacy Policy | PrepFit",
            description: "Read how PrepFit collects, uses, and protects your data."
          },
          "/fasting": {
            title: "Fasting Guide | PrepFit",
            description: "A guide to 18:6 intermittent fasting, eating windows, high-protein meals, and common mistakes."
          },
          "/windows": {
            title: "Install on Windows | PrepFit",
            description: "Install PrepFit on Windows to plan meals and track your progress from your desktop."
          }
        };
        var page = pages[path];
        var robots = document.createElement("meta");
        robots.name = "robots";
        robots.content = page ? "index, follow" : "noindex, follow";
        document.head.appendChild(robots);
        if (!page) {
          document.getElementById("home-structured-data").remove();
          return;
        }
        var url = "https://prepfit.fit" + path;
        document.title = page.title;
        document.querySelector('meta[name="description"]').content = page.description;
        var canonical = document.createElement("link");
        canonical.rel = "canonical";
        canonical.href = url;
        document.head.appendChild(canonical);
        document.querySelector('meta[property="og:url"]').content = url;
        document.querySelector('meta[property="og:title"]').content = page.title;
        document.querySelector('meta[property="og:description"]').content = page.description;
        document.querySelector('meta[name="twitter:url"]').content = url;
        document.querySelector('meta[name="twitter:title"]').content = page.title;
        document.querySelector('meta[name="twitter:description"]').content = page.description;
        if (path !== "/") document.getElementById("home-structured-data").remove();
      })();
    </script>

    <!-- Icons & Manifest -->
    <link rel="icon" href="/favicon.ico" sizes="any" />

  </head>
